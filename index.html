<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكاري اليومية ✨</title>
    <style>
        :root {
            --main-pink: #ff85a2; /* بينك غامق */
            --light-pink: #fbb1bd; /* بينك فاتح */
            --soft-pink: #ffdae0; /* خلفية هادئة */
            --white: #ffffff;
            --text-color: #5e3038;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--soft-pink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .app-container {
            width: 95%;
            max-width: 400px;
            background: var(--white);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 133, 162, 0.3);
            overflow: hidden;
            position: relative;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--main-pink);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* الأزرار الملونة */
        .btn-large {
            width: 100%;
            border: none;
            padding: 25px;
            border-radius: 20px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .btn-azkar { background-color: #ff85a2; }
        .btn-subha { background-color: #fbb1bd; }
        
        /* ألوان أيقونات الأذكار الداخلية */
        .btn-sabah { background-color: #ff9aa2; }
        .btn-masaa { background-color: #b5ead7; color: #3a5a40; }
        .btn-nom { background-color: #c7ceea; color: #3d405b; }
        .btn-salah { background-color: #ffdac1; color: #6d4c41; }

        .btn-large:active { transform: scale(0.95); }

        .zekr-item {
            background: var(--soft-pink);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            line-height: 1.8;
            font-size: 1.1rem;
            border-right: 6px solid var(--main-pink);
            text-align: justify;
        }

        .subha-container { text-align: center; }

        .zekr-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--main-pink);
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-circle {
            width: 200px;
            height: 200px;
            background: var(--main-pink);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            color: white;
            cursor: pointer;
            border: 8px solid var(--soft-pink);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.4);
        }

        .counter-circle span { font-size: 3rem; font-weight: bold; }

        .subha-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        .control-btn {
            background: var(--main-pink);
            border: none;
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            width: 45%;
        }

        .back-btn {
            background: #eee;
            color: #555;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="header-title">أذكاري اليومية ✨</div>

    <div class="content-area">
        <div id="home" class="page active">
            <div style="margin-top: 50px;">
                <button class="btn-large btn-azkar" onclick="showPage('categories')">🌸 أذكار</button>
                <button class="btn-large btn-subha" onclick="showPage('subha')">📿 تسبيح</button>
            </div>
        </div>

        <div id="categories" class="page">
            <button class="back-btn" onclick="showPage('home')">⬅ رجوع للرئيسية</button>
            <button class="btn-large btn-sabah" onclick="loadAzkar('صباح')">☀️ أذكار الصباح</button>
            <button class="btn-large btn-masaa" onclick="loadAzkar('مساء')">🌙 أذكار المساء</button>
            <button class="btn-large btn-nom" onclick="loadAzkar('نوم')">🛌 أذكار النوم</button>
            <button class="btn-large btn-salah" onclick="loadAzkar('صلاة')">🕌 أذكار الصلاة</button>
        </div>

        <div id="display" class="page">
            <button class="back-btn" onclick="showPage('categories')">⬅ رجوع للأقسام</button>
            <div id="azkar-content"></div>
        </div>

        <div id="subha" class="page">
            <button class="back-btn" onclick="showPage('home')">⬅ رجوع للرئيسية</button>
            <div class="subha-container">
                <div id="current-zekr" class="zekr-display">سبحان الله</div>
                <div class="counter-circle" onclick="countUp()">
                    <span id="num">0</span>
                    <small>تسبيح</small>
                </div>
                <div class="subha-controls">
                    <button class="control-btn" onclick="addZekr()">➕ إضافة ذكر</button>
                    <button class="control-btn" onclick="nextZekr()">🔄 تغيير الذكر</button>
                </div>
                <button class="control-btn" style="margin-top:20px; width:100%; background:#999" onclick="reset()">تصفير العداد</button>
            </div>
        </div>
    </div>
</div>

<script>
    const data = {
        'صباح': [
            "آية الكرسي: أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ (اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...)",
            "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.",
            "اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور.",
            "سيد الاستغفار: اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت.",
            "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين.",
            "رضيت بالله رباً، وبالإسلام ديناً، وبمحمد صلى الله عليه وسلم نبياً.",
            "اللهم إني أسألك علماً نافعاً، ورزقاً طيباً، وعملاً متقبلاً."
        ],
        'مساء': [
            "أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له.",
            "اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير.",
            "أعوذ بكلمات الله التامات من شر ما خلق.",
            "اللهم ما أمسى بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر.",
            "حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم (7 مرات)."
        ],
        'نوم': [
            "باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين.",
            "اللهم قني عذابك يوم تبعث عبادك (3 مرات).",
            "باسمك اللهم أموت وأحيا.",
            "سورة الإخلاص، والفلق، والناس (3 مرات)، ثم المسح على الجسد."
        ],
        'صلاة': [
            "أستغفر الله (3 مرات)، اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام.",
            "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد.",
            "سبحان الله (33)، الحمد لله (33)، الله أكبر (33)، ثم تمام المئة: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير."
        ]
    };

    let subhaList = [
        "سبحان الله", 
        "لا إله إلا الله", 
        "الله أكبر", 
        "الحمدلله", 
        "سبحان الله وبحمده سبحان الله العظيم", 
        "ربي اهدني فيمن هديت وعافني فيمن عافيت وتولني فيمن توليت واهدني إنك أنت أرحم الراحمين"
    ];
    let zIdx = 0; 
    let counter = 0;

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if(id === 'home') document.getElementById('header-title').innerText = 'أذكاري اليومية ✨';
        if(id === 'categories') document.getElementById('header-title').innerText = 'الأذكار 🌸';
        if(id === 'subha') document.getElementById('header-title').innerText = 'السبحة 📿';
    }

    function loadAzkar(type) {
        const box = document.getElementById('azkar-content');
        box.innerHTML = '';
        document.getElementById('header-title').innerText = "أذكار " + type;
        data[type].forEach(z => {
            const d = document.createElement('div');
            d.className = 'zekr-item';
            d.innerText = z;
            box.appendChild(d);
        });
        showPage('display');
    }

    function countUp() { 
        counter++; 
        document.getElementById('num').innerText = counter;
        if(navigator.vibrate) navigator.vibrate(50); // اهتزاز بسيط
    }

    function reset() { 
        counter = 0; 
        document.getElementById('num').innerText = '0'; 
    }

    function nextZekr() {
        zIdx = (zIdx + 1) % subhaList.length;
        document.getElementById('current-zekr').innerText = subhaList[zIdx];
        reset();
    }

    function addZekr() {
        let n = prompt("اكتبي الذكر الجديد اللي حابة تضيفيه:");
        if(n) { 
            subhaList.push(n); 
            alert("تم إضافة الذكر بنجاح! تقدري تلاقيه في تغيير الذكر."); 
        }
    }
</script>

</body>
</html>
