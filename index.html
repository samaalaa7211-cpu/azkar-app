<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Quran Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f6fa;
}

header{
  background:#1f7a5c;
  color:white;
  padding:15px;
  text-align:center;
}

.page{display:none;padding:15px;}
.active{display:block;}

.card{
  background:white;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  cursor:pointer;
}

button{
  background:#1f7a5c;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  margin:5px 0;
  width:100%;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}

.ayah{
  background:#fff;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}

audio{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<header>📖 Offline Quran Pro</header>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card" onclick="openQuran()">📖 القرآن الكريم</div>
</div>

<!-- QURAN -->
<div id="quran" class="page">
  <h3>السور</h3>

  <input id="search" placeholder="ابحث عن سورة">
  <button onclick="search()">بحث</button>

  <div id="list"></div>

  <button onclick="back()">رجوع</button>
</div>

<!-- SURAH -->
<div id="surahPage" class="page">
  <h3 id="title"></h3>

  <div id="ayahs"></div>

  <button onclick="play()">▶ تشغيل التلاوة</button>
  <button onclick="stop()">⏹ إيقاف</button>

  <audio id="audio" controls></audio>

  <button onclick="backList()">رجوع</button>
</div>

<script>

let surahs=[];
let current=null;
let audio=document.getElementById("audio");

// ===== OFFLINE CACHE LOAD =====
let cached = localStorage.getItem("quran");

if(cached){
  surahs = JSON.parse(cached);
}else{
  fetch("https://api.alquran.cloud/v1/quran/ar.alafasy")
  .then(r=>r.json())
  .then(d=>{
    surahs = d.data.surahs;
    localStorage.setItem("quran", JSON.stringify(surahs));
  });
}

// ===== NAV =====
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function openQuran(){
  show("quran");
  render(surahs);
}

function back(){
  show("home");
}

function backList(){
  show("quran");
}

// ===== RENDER =====
function render(list){
  let box=document.getElementById("list");
  box.innerHTML="";

  list.forEach(s=>{
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=s.number+" - "+s.name;

    div.onclick=()=>openSurah(s);

    box.appendChild(div);
  });
}

// ===== SEARCH =====
function search(){
  let v=document.getElementById("search").value;

  let f=surahs.filter(s=>s.name.includes(v));
  render(f);
}

// ===== SURAH =====
function openSurah(s){
  current=s;
  show("surahPage");

  document.getElementById("title").innerText=
  s.number+" - "+s.name;

  let ayahs=s.ayahs.map(a=>
    `<div class="ayah">${a.text}</div>`
  ).join("");

  document.getElementById("ayahs").innerHTML=ayahs;
}

// ===== AUDIO OFFLINE CACHE =====
function play(){
  let url=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${current.number}.mp3`;

  audio.src=url;
  audio.play();
}

function stop(){
  audio.pause();
}

</script>

<!-- SERVICE WORKER -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
