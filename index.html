<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Blue App</title>

<style>
:root{
  --main:#1e88e5;
  --bg:#f5f9ff;
  --card:#ffffff;
  --text:#0a0a0a;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--main);
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.page{display:none;padding:15px;}
.active{display:block;}

.card{
  background:var(--card);
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer;
}

button{
  background:var(--main);
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  margin:5px 0;
  width:100%;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}

.ayah{
  background:#eef5ff;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  font-size:18px;
}

.number{
  font-size:20px;
  padding:8px;
  margin:5px;
  background:#e3f2fd;
  border-radius:8px;
}

.audioBox{
  margin-top:10px;
}
</style>
</head>

<body>

<header>📖 القرآن الكريم - النسخة الزرقاء</header>

<!-- HOME -->
<div id="home" class="page active">
  <h3>السور</h3>

  <input id="search" placeholder="ابحث عن سورة">
  <button onclick="searchSurah()">بحث</button>

  <div id="list"></div>
</div>

<!-- SURAH PAGE -->
<div id="surah" class="page">
  <h3 id="surahTitle"></h3>

  <button onclick="openTalawe()">🎧 تلاوة السورة كاملة</button>
  <button onclick="openMemorize()">🧠 تسميع الآيات</button>

  <div id="ayahs"></div>

  <button onclick="backHome()">رجوع</button>
</div>

<!-- TALAWE -->
<div id="talawe" class="page">
  <h3>🎧 التلاوة الكاملة</h3>

  <audio id="audio" controls></audio>

  <button onclick="backSurah()">رجوع</button>
</div>

<!-- MEMORIZE -->
<div id="mem" class="page">
  <h3>🧠 التسميع (أرقام فقط)</h3>

  <div id="numbers"></div>

  <button onclick="startRecite()">▶ ابدأ</button>
  <button onclick="stopRecite()">⏹ إيقاف</button>

  <button onclick="backSurah()">رجوع</button>
</div>

<script>

let surahs=[];
let current=null;
let audio=document.getElementById("audio");
let interval;
let ayahIndex=0;

// ===== LOAD QURAN =====
fetch("https://api.alquran.cloud/v1/quran/ar.alafasy")
.then(r=>r.json())
.then(d=>{
  surahs=d.data.surahs;
  render(surahs);
});

// ===== NAV =====
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ===== HOME =====
function render(list){
  let box=document.getElementById("list");
  box.innerHTML="";

  list.forEach(s=>{
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=s.number+" - "+s.name;

    div.onclick=()=>openSurah(s);

    box.appendChild(div);
  });
}

function searchSurah(){
  let v=document.getElementById("search").value;
  let f=surahs.filter(s=>s.name.includes(v));
  render(f);
}

function openSurah(s){
  current=s;
  show("surah");

  document.getElementById("surahTitle").innerText=
  s.number+" - "+s.name;

  let html=s.ayahs.map(a=>
    `<div class="ayah">${a.text}</div>`
  ).join("");

  document.getElementById("ayahs").innerHTML=html;
}

// ===== TALAWE =====
function openTalawe(){
  show("talawe");

  let url=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${current.number}.mp3`;
  audio.src=url;
  audio.play();
}

function backSurah(){
  show("surah");
}

function backHome(){
  show("home");
}

// ===== MEMORIZE =====
function openMemorize(){
  show("mem");

  let box=document.getElementById("numbers");
  box.innerHTML="";

  current.ayahs.forEach((a,i)=>{
    let d=document.createElement("div");
    d.className="number";
    d.innerHTML="آية رقم " + (i+1);
    box.appendChild(d);
  });
}

// ===== SIMULATED RECITATION =====
function startRecite(){
  ayahIndex=0;

  interval=setInterval(()=>{
    if(ayahIndex<current.ayahs.length){
      let items=document.querySelectorAll(".number");
      items[ayahIndex].style.background="#bbdefb";
      ayahIndex++;
    }else{
      clearInterval(interval);
    }
  },1500);
}

function stopRecite(){
  clearInterval(interval);
}

</script>

</body>
</html>
