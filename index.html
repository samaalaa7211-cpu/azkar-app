<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Blue App</title>

<style>
:root{
  --main:#1e88e5;
  --bg:#f5f9ff;
  --card:#ffffff;
  --text:#0a0a0a;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--main);
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.page{display:none;padding:15px;}
.active{display:block;}

.card{
  background:var(--card);
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer;
}

button{
  background:var(--main);
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  margin:5px 0;
  width:100%;
  cursor:pointer;
  font-size: 16px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  box-sizing: border-box;
}

.ayah{
  background:#eef5ff;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  font-size:18px;
  line-height: 1.6;
}

.number{
  font-size:18px;
  padding:12px;
  margin:8px 0;
  background:#e3f2fd;
  border-radius:8px;
  transition: all 0.3s ease;
  border: 1px solid #cee6f8;
}

.listening {
  background: #fff59d !important; /* لون أصفر يوضح أن المايك يقرأ هذه الآية الآن */
  border: 1px solid #fbc02d;
  font-weight: bold;
}

.success-ayah {
  background: #e8f5e9 !important; /* لون أخضر هادئ تظهر به الآية المشكلة والتجويد */
  border: 1px solid #a5d6a7;
  font-size: 20px;
  color: #2e7d32;
  line-height: 1.8;
}

#status {
  text-align: center;
  font-weight: bold;
  color: #c62828;
  margin: 10px 0;
}
</style>
</head>

<body>

<header>📖 القرآن الكريم - النسخة الزرقاء</header>

<div id="home" class="page active">
  <h3>السور</h3>

  <input id="search" placeholder="ابحث عن سورة">
  <button onclick="searchSurah()">بحث</button>

  <div id="list"></div>
</div>

<div id="surah" class="page">
  <h3 id="surahTitle"></h3>

  <button onclick="openTalawe()">🎧 تلاوة السورة كاملة</button>
  <button onclick="openMemorize()">🧠 تسميع الآيات بالتفاعل الصوتي</button>

  <div id="ayahs"></div>

  <button onclick="backHome()">رجوع</button>
</div>

<div id="talawe" class="page">
  <h3>🎧 التلاوة الكاملة</h3>

  <audio id="audio" controls></audio>

  <button onclick="backSurah()">رجوع</button>
</div>

<div id="mem" class="page">
  <h3>🧠 التسميع الصوتي التفاعلي</h3>
  <div id="status">اضغط ابدأ لبدء التسميع بالصوت</div>

  <div id="numbers"></div>

  <button onclick="startRecite()">▶ ابدأ الاستماع</button>
  <button onclick="stopRecite()">⏹ إيقاف الاستماع</button>

  <button onclick="backSurah()">رجوع</button>
</div>

<script>

let surahs=[];
let current=null;
let audio=document.getElementById("audio");
let ayahIndex=0;

// إعداد خاصية التعرف على الصوت
let recognition;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-EG'; // اللغة العربية
  recognition.continuous = false; // يقف بعد كل آية ليقارن ثم يعيد تشغيل نفسه للآية التالية
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    let resultText = event.results[0][0].transcript;
    checkRecitation(resultText);
  };

  recognition.onerror = function(event) {
    console.log("خطأ في المايكروفون أو لم يتم سماع صوت: " + event.error);
    // إعادة تشغيل المايكروفون تلقائياً إذا توقف بسبب عدم سماع صوت لضمان استمرارية التسميع
    if(event.error === 'no-speech' && ayahIndex < current.ayahs.length) {
      document.getElementById("status").innerText = "🎙️ لم أسمعك جيداً، أعد قراءة الآية الحالية...";
      setTimeout(() => { if(recognition) recognition.start(); }, 1000);
    }
  };

  recognition.onend = function() {
    // في حال انتهى الاستماع ولم ننتقل للآية التالية بعد، يعود للاستماع لنفس الآية
    let statusText = document.getElementById("status").innerText;
    if(statusText.includes("🎙️ مستمع") && ayahIndex < current.ayahs.length) {
        try { recognition.start(); } catch(e){}
    }
  };
}

// دالة لتنظيف النص العربي من التشكيل والتنوين لتسهيل المقارنة البرمجية الصحيحة للصوت
function cleanArabicText(text) {
  return text
    .replace(/[\u064B-\u065F]/g, "") // إزالة التشكيل والسكون
    .replace(/[أإآ]/g, "ا") // توحيد الألفات
    .replace(/ة/g, "ه") // توحيد التاء المربوطة والهاء
    .replace(/ى/g, "ي") // توحيد الألف المقصورة والياء
    .trim();
}

// ===== LOAD QURAN =====
fetch("https://api.alquran.cloud/v1/quran/ar.alafasy")
.then(r=>r.json())
.then(d=>{
  surahs=d.data.surahs;
  render(surahs);
});

// ===== NAV =====
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ===== HOME =====
function render(list){
  let box=document.getElementById("list");
  box.innerHTML="";

  list.forEach(s=>{
    let div=document.createElement("div");
    div.className="card";
    div.innerHTML=s.number+" - "+s.name;

    div.onclick=()=>openSurah(s);

    box.appendChild(div);
  });
}

function searchSurah(){
  let v=document.getElementById("search").value;
  let f=surahs.filter(s=>s.name.includes(v));
  render(f);
}

function openSurah(s){
  current=s;
  show("surah");

  document.getElementById("surahTitle").innerText=
  s.number+" - "+s.name;

  let html=s.ayahs.map(a=>
    `<div class="ayah">${a.text}</div>`
  ).join("");

  document.getElementById("ayahs").innerHTML=html;
}

// ===== TALAWE =====
function openTalawe(){
  show("talawe");

  let url=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${current.number}.mp3`;
  audio.src=url;
  audio.play();
}

function backSurah(){
  stopRecite();
  show("surah");
}

function backHome(){
  show("home");
}

// ===== MEMORIZE =====
function openMemorize(){
  show("mem");
  document.getElementById("status").innerText = "اضغط ابدأ لبدء التسميع بالصوت";

  let box=document.getElementById("numbers");
  box.innerHTML="";

  current.ayahs.forEach((a,i)=>{
    let d=document.createElement("div");
    d.className="number";
    d.id = "num-" + i;
    d.innerHTML="آية رقم " + (i+1);
    box.appendChild(d);
  });
}

// ===== VOICE RECITATION LOGIC =====
function startRecite(){
  if (!recognition) {
    alert("عذراً، متصفحك لا يدعم ميزة التعرف على الصوت. يرجى استخدام متصفح Google Chrome.");
    return;
  }
  ayahIndex = 0;
  // إعادة تصفير كل العناصر للشكل الأصلي
  document.querySelectorAll(".number").forEach((item, i) => {
    item.className = "number";
    item.innerHTML = "آية رقم " + (i+1);
  });
  
  listenToCurrentAyah();
}

function listenToCurrentAyah() {
  if(ayahIndex < current.ayahs.length) {
    document.getElementById("status").innerText = `🎙️ مستمع للآية رقم (${ayahIndex + 1})... اقرأ الآن`;
    
    // تمييز الآية المطلوبة باللون الأصفر
    let currentItem = document.getElementById("num-" + ayahIndex);
    if(currentItem) {
      currentItem.classList.add("listening");
    }
    
    try {
      recognition.start();
    } catch(e) {
      // إذا كان يعمل بالفعل لا نفعل شيئاً
    }
  } else {
    document.getElementById("status").innerText = "🎉 بارك الله فيك! أكملت تسميع السورة بنجاح.";
  }
}

function checkRecitation(userVoiceText) {
  let originalAyah = current.ayahs[ayahIndex].text;
  
  let cleanOriginal = cleanArabicText(originalAyah);
  let cleanUser = cleanArabicText(userVoiceText);
  
  console.log("الآية الأصلية المصورة مبرمجاً:", cleanOriginal);
  console.log("ما سمعه المايك:", cleanUser);

  // إذا كانت الكلمات المسموعة موجودة أو متطابقة مع النص الأصلي
  if(cleanOriginal.includes(cleanUser) || cleanUser.includes(cleanOriginal) || similarity(cleanOriginal, cleanUser) > 0.6) {
    let currentItem = document.getElementById("num-" + ayahIndex);
    if(currentItem) {
      currentItem.classList.remove("listening");
      currentItem.classList.add("success-ayah");
      // إظهار الآية كاملة بالتجويد والتشكيل رقم الترتيب
      currentItem.innerHTML = `﴿${ayahIndex + 1}﴾ ${originalAyah}`;
    }
    
    // الانتقال التلقائي للآية التالية
    ayahIndex++;
    setTimeout(() => {
      listenToCurrentAyah();
    }, 800);
  } else {
    document.getElementById("status").innerText = `❌ المقارنة غير مطابقة تماماً. أنت قلت: "${userVoiceText}". حاول مرة أخرى...`;
    setTimeout(() => {
      if(ayahIndex < current.ayahs.length) {
         document.getElementById("status").innerText = `🎙️ مستمع للآية رقم (${ayahIndex + 1})... اقرأ الآن`;
         try { recognition.start(); } catch(e){}
      }
    }, 2000);
  }
}

function stopRecite(){
  if(recognition) {
    recognition.stop();
  }
  document.getElementById("status").innerText = "⏹️ تم إيقاف الاستماع.";
  document.querySelectorAll(".listening").forEach(item => item.classList.remove("listening"));
}

// دالة تقريبية إضافية للتأكد من نسبة تشابه النصوص في حال سقطت كلمة أو حرف أثناء لقط المايك
function similarity(s1, s2) {
  let longer = s1;
  let shorter = s2;
  if (s1.length < s2.length) { longer = s2; shorter = s1; }
  let longerLength = longer.length;
  if (longerLength == 0) { return 1.0; }
  return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
}

function editDistance(s1, s2) {
  s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
  let costs = new Array();
  for (let i = 0; i <= s1.length; i++) {
    let lastValue = i;
    for (let j = 0; j <= s2.length; j++) {
      if (i == 0) costs[j] = j;
      else {
        if (j > 0) {
          let newValue = costs[j - 1];
          if (s1.charAt(i - 1) != s2.charAt(j - 1))
            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
          costs[j - 1] = lastValue; lastValue = newValue;
        }
      }
    }
    if (i > 0) costs[s2.length] = lastValue;
  }
  return costs[s2.length];
}

</script>

</body>
</html>
